openapi: 3.1.0
info:
  title: 云笔AI 复刻 · AI 网关 API
  version: 1.0.0
  description: |
    主控权威契约 - AI 模块 (/ai)
    12 厂商统一抽象, BYOK 模式, SSE 流式输出
    端点 8 个: config / status / chat / chat/session / chat/stream / test / models

servers:
  - url: /api

tags:
  - name: ai
    description: AI 网关模块

paths:
  /ai/config:
    get:
      tags: [ai]
      summary: 获取当前用户 AI 配置
      security: [bearerAuth: []]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, description: 12 厂商之一, 见 providers.json }
                  model: { type: string }
                  apiKey: { type: string, description: 加密返回 }
                  baseUrl: { type: string, format: uri }
                  思考模式: { type: boolean, default: true }
                  temperature: { type: number, minimum: 0, maximum: 2, default: 0.85 }
                  max_tokens: { type: integer, default: 8192 }
    put:
      tags: [ai]
      summary: 更新 AI 配置
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string }
                model: { type: string }
                apiKey: { type: string }
                baseUrl: { type: string, format: uri }
                思考模式: { type: boolean }
                temperature: { type: number }
                max_tokens: { type: integer }
      responses:
        '200': { description: 成功 }

  /ai/status:
    get:
      tags: [ai]
      summary: AI 状态 (所有厂商 + 模型列表)
      security: [bearerAuth: []]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: "deepseek" }
                        name: { type: string, example: "DeepSeek" }
                        enabled: { type: boolean }
                        models:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string, example: "deepseek-chat" }
                              name: { type: string }
                              思考模式: { type: boolean }
                              默认参数:
                                type: object
                                properties:
                                  temperature: { type: number }
                                  max_tokens: { type: integer }

  /ai/chat:
    post:
      tags: [ai]
      summary: 同步对话
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [system, user, assistant] }
                      content: { type: string }
                options:
                  $ref: '#/components/schemas/ChatOptions'
      responses:
        '200': { description: 成功 }
        '502': { description: AI 上游失败 }

  /ai/chat/session:
    post:
      tags: [ai]
      summary: 创建 AI 会话 (返回 sessionId)
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                options:
                  $ref: '#/components/schemas/ChatOptions'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionId: { type: string, format: uuid }

  /ai/chat/stream/{sessionId}:
    get:
      tags: [ai]
      summary: SSE 流式对话 (text/event-stream)
      security: []
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: token, required: true, schema: { type: string, description: "JWT (EventSource 无法设 header, 走 query)" } }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  7 个事件类型 (与 ai-stream.ts 一致):
                  - stream.start: { sessionId, requestId, model, mode }
                  - stream.chunk: { delta, index }
                  - stream.thinking: { thinkingChunk, index }
                  - stream.tool_call: { toolName, args }
                  - stream.done: { totalTokens, finishReason }
                  - stream.error: { code, message }
                  - stream.aborted: { sessionId }

  /ai/test:
    post:
      tags: [ai]
      summary: AI 连接测试
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { type: string }
                model: { type: string }
                apiKey: { type: string, description: 测试时可临时传入 }
      responses:
        '200': { description: 测试成功 }
        '502': { description: 连接失败 }

  /ai/models:
    get:
      tags: [ai]
      summary: 扁平模型列表 (key = provider)
      security: [bearerAuth: []]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: object
                    properties:
                      key: { type: string }
                      name: { type: string }
                      思考模式: { type: boolean }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatOptions:
      type: object
      properties:
        provider: { type: string, example: "deepseek" }
        model: { type: string, example: "deepseek-chat" }
        stream: { type: boolean, default: true }
        conversationId: { type: string, description: 会话上下文 ID (可空)" }
        对话ID: { type: string, description: 中文键名版本, 与 conversationId 互为别名" }
        模式:
          type: string
          enum: [续写, 润色, 改写, 扩写, 总结, 对话, 查漏, 修正, 展开, 蒸馏, 自定义]
        思考模式: { type: boolean, default: true }
        temperature: { type: number, minimum: 0, maximum: 2, default: 0.85 }
        max_tokens: { type: integer, default: 8192 }
        contextBudget:
          type: integer
          default: 8000
          description: 上下文窗口预算 (主控调度自动填充 messages)" }
