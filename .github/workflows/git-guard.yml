name: Git Guard

on:
  pull_request:
    branches:
      - master
      - master-codex
  push:
    branches:
      - master
      - master-codex
      - "codex/**"
      - "feature/**"
      - "fix/**"

jobs:
  guard:
    name: Contract and hook guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Contract lint
        run: python scripts/contract-lint.py

      - name: Hook syntax check
        run: python -m py_compile .githooks/pre-commit .githooks/commit-msg scripts/install-git-guard.py scripts/contract-lint.py
