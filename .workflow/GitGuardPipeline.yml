name: git-guard
displayName: Git Guard
triggers:
  push:
    branches:
      include:
        - master-codex
        - codex/*
        - feature/*
  pullRequest:
    branches:
      include:
        - master-codex
stages:
  - name: guard
    displayName: Git guard checks
    steps:
      - step: pythonbuild@1
        name: contract_lint
        displayName: Contract lint
        inputs:
          pythonVersion: "3.12"
          commands:
            - pip install pyyaml
            - python scripts/contract-lint.py
      - step: pythonbuild@1
        name: hook_syntax
        displayName: Hook syntax check
        inputs:
          pythonVersion: "3.12"
          commands:
            - python -m py_compile .githooks/pre-commit .githooks/commit-msg scripts/install-git-guard.py scripts/contract-lint.py
